name: render

on:
  workflow_dispatch:
    inputs:
      deliverables:
        description: "all, comma-separated deliverable ids, or selftest"
        default: V5-V003-reel
        required: true
      job:
        description: "job file name"
        default: latest.json
      force:
        description: "1 = re-render even if already final"
        default: "0"

# Drive credentials exist only in the env of the host steps that call bootstrap/drive.py. Untrusted code only ever
# runs in the hardened container (bootstrap/run.sh box), which receives no credential and no GITHUB_* variable.
permissions:
  contents: read

concurrency: render

jobs:
  selftest:   # host only, no container: proves what the renderer account can and cannot reach
    if: inputs.deliverables == 'selftest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SELECTION: ${{ inputs.deliverables }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Drive boundary self-test (host)
        env: &gd_s
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_STUDIO_FOLDER_ID: ${{ vars.DRIVE_STUDIO_FOLDER_ID }}
          DRIVE_FINAL_FOLDER_ID: ${{ vars.DRIVE_FINAL_FOLDER_ID }}
          DRIVE_BUNDLE_PATH: ${{ vars.DRIVE_BUNDLE_PATH }}
          DRIVE_BUNDLE_SHA256: ${{ secrets.DRIVE_BUNDLE_SHA256 }}
        run: bootstrap/run.sh selftest "$SELECTION"
      - name: Cleanup
        if: always()
        env: *gd_s
        run: bootstrap/run.sh cleanup "$SELECTION"

  plan:
    if: inputs.deliverables != 'selftest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.publish.outputs.matrix }}
    env:
      SELECTION: ${{ inputs.deliverables }}
      V5_JOB: ${{ inputs.job }}
      V5_FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Fetch bundle and job (host)
        env: &gd
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_STUDIO_FOLDER_ID: ${{ vars.DRIVE_STUDIO_FOLDER_ID }}
          DRIVE_FINAL_FOLDER_ID: ${{ vars.DRIVE_FINAL_FOLDER_ID }}
          DRIVE_BUNDLE_PATH: ${{ vars.DRIVE_BUNDLE_PATH }}
          DRIVE_BUNDLE_SHA256: ${{ secrets.DRIVE_BUNDLE_SHA256 }}
        run: bootstrap/run.sh fetch "$SELECTION"
      - name: Build sandbox image (no credentials)
        run: bootstrap/run.sh image "$SELECTION"
      - name: Pull ledger (host)
        env: *gd
        run: bootstrap/run.sh plan-pull "$SELECTION"
      - name: Plan (container, network none)
        run: bootstrap/run.sh plan "$SELECTION"
      - name: Publish plan (host)
        id: publish
        env: *gd
        run: bootstrap/run.sh plan-publish "$SELECTION"
      - name: Cleanup
        if: always()
        env: *gd
        run: bootstrap/run.sh cleanup plan

  render:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false   # one failed deliverable never cancels the others
      max-parallel: 2
      matrix:
        deliverable: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DELIVERABLE: ${{ matrix.deliverable }}
      V5_JOB: ${{ inputs.job }}
      V5_FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Fetch bundle and job (host)
        env: &gd_r
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_STUDIO_FOLDER_ID: ${{ vars.DRIVE_STUDIO_FOLDER_ID }}
          DRIVE_FINAL_FOLDER_ID: ${{ vars.DRIVE_FINAL_FOLDER_ID }}
          DRIVE_BUNDLE_PATH: ${{ vars.DRIVE_BUNDLE_PATH }}
          DRIVE_BUNDLE_SHA256: ${{ secrets.DRIVE_BUNDLE_SHA256 }}
        run: bootstrap/run.sh fetch "$DELIVERABLE"
      - name: Build sandbox image (no credentials)
        run: bootstrap/run.sh image "$DELIVERABLE"
      - name: Install (container, no credentials)
        run: bootstrap/run.sh install "$DELIVERABLE"
      - name: Plan inputs (container, network none)
        run: bootstrap/run.sh inputs "$DELIVERABLE"
      - name: Pull inputs (host)
        env: *gd_r
        run: bootstrap/run.sh pull "$DELIVERABLE"
      - name: Render (container, network none)
        id: render
        run: bootstrap/run.sh render "$DELIVERABLE"
      - name: Upload and verify (host)
        if: always() && steps.render.outcome != 'skipped'
        env: *gd_r
        run: bootstrap/run.sh upload "$DELIVERABLE"
      - name: Cleanup
        if: always()
        env: *gd_r
        run: bootstrap/run.sh cleanup "$DELIVERABLE"
